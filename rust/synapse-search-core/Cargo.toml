[package]
name = "synapse-search-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
description = "Native workspace search algorithms for Synapse."
publish = false

[lib]
name = "synapse_search_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
grep-regex = "0.1"
grep-searcher = "0.1"
globset = "0.4"
ignore = "0.4"
pyo3 = { version = "0.23", features = ["abi3-py312", "extension-module"] }
serde_json = "1.0"
thiserror = "2.0"