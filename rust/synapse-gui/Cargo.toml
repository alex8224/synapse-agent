[package]
name = "synapse-gui"
version = "0.1.0"
edition = "2021"
description = "Desktop wrapper and system tray guardian for Synapse"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "process", "sync", "time"] }
open = "5"
window-vibrancy = "0.6"
portable-pty = "0.9.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }
