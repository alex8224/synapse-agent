<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Matte Obsidian Squircle Tile Background Gradient -->
    <linearGradient id="squircleBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141820" />
      <stop offset="100%" stop-color="#0b0e14" />
    </linearGradient>

    <!-- Crisp, Precision 1px Chamfer Rim Highlight (Linear / Raycast / macOS style) -->
    <linearGradient id="squircleBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.14)" />
      <stop offset="40%" stop-color="rgba(255, 255, 255, 0.05)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.01)" />
    </linearGradient>

    <!-- Authoritative Developer Vector Gradients (Electric Cobalt Blue #3b82f6 to Deep Indigo #4f46e5) -->
    <linearGradient id="primaryConduitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="topToBottomLeftGrad" x1="256" y1="140" x2="152" y2="332" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="topToBottomRightGrad" x1="256" y1="140" x2="360" y2="332" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="horizontalBaseGrad" x1="152" y1="332" x2="360" y2="332" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="centerJunctionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- Standard Dock Depth Shadow (Strictly clean drop shadow, no magical neon bloom/blur) -->
    <filter id="tileShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <!-- Subtle Mechanical Vector Depth for the Emblem -->
    <filter id="conduitShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Ambient Workspace Backdrop -->
  <rect width="512" height="512" fill="#07090e" />

  <!-- App Icon Base: Precision Matte Obsidian Squircle Tile (#0d1117 aesthetic) -->
  <g filter="url(#tileShadow)">
    <rect x="52" y="52" width="408" height="408" rx="94" fill="url(#squircleBg)" />
    <!-- 1px Precision Chamfer Border -->
    <rect x="52.5" y="52.5" width="407" height="407" rx="93.5" fill="none" stroke="url(#squircleBorder)" stroke-width="1.5" />
  </g>

  <!-- Developer Tool Tri-Node Neural Network Emblem (Clean, confident, solid vector geometry) -->
  <!-- 
    Geometry Blueprint:
    Node A (Top Apex): (256, 142)
    Node B (Bottom Right): (356, 332)
    Node C (Bottom Left): (156, 332)
    Central Junction Hub: (256, 268)
    
    Conduit Width: 26px solid uniform stroke with clean rounded caps and precision miter/bevel joins.
    Node Outer Radius: 36px solid cobalt/indigo disc
    Node Inner Core: 14px high-contrast crisp white core with solid dark slate ring.
    High legibility guaranteed down to 16x16 dock/favicon resolution.
  -->
  <g filter="url(#conduitShadow)">
    <!-- Outer Triangle Conduits (Perimeter Bus) -->
    <path d="M 256 142 L 356 332" fill="none" stroke="url(#topToBottomRightGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 356 332 L 156 332" fill="none" stroke="url(#horizontalBaseGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 156 332 L 256 142" fill="none" stroke="url(#topToBottomLeftGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Interior Radial Conduits (Synaptic Axons connecting to Central Hub at 256, 268) -->
    <path d="M 256 142 L 256 268" fill="none" stroke="url(#topToBottomRightGrad)" stroke-width="22" stroke-linecap="round" />
    <path d="M 356 332 L 256 268" fill="none" stroke="url(#horizontalBaseGrad)" stroke-width="22" stroke-linecap="round" />
    <path d="M 156 332 L 256 268" fill="none" stroke="url(#topToBottomLeftGrad)" stroke-width="22" stroke-linecap="round" />

    <!-- Central Junction Hub (Solid geometric nexus point) -->
    <g>
      <!-- Central Hub Outer Ring / Housing -->
      <circle cx="256" cy="268" r="26" fill="#121620" stroke="url(#centerJunctionGrad)" stroke-width="7" />
      <!-- Central Node Pin / Core -->
      <circle cx="256" cy="268" r="9" fill="#ffffff" />
    </g>

    <!-- Node 1: Top Apex Node (Electric Cobalt Focus) -->
    <g id="apex-node">
      <!-- Outer Solid Node Body -->
      <circle cx="256" cy="142" r="38" fill="#3b82f6" />
      <!-- Dark Mechanical Separator Ring -->
      <circle cx="256" cy="142" r="22" fill="#0e131d" />
      <!-- High-Contrast Solid White Terminal Core -->
      <circle cx="256" cy="142" r="11" fill="#ffffff" />
    </g>

    <!-- Node 2: Bottom-Right Node (Deep Indigo Focus) -->
    <g id="right-node">
      <!-- Outer Solid Node Body -->
      <circle cx="356" cy="332" r="38" fill="#4f46e5" />
      <!-- Dark Mechanical Separator Ring -->
      <circle cx="356" cy="332" r="22" fill="#0e131d" />
      <!-- High-Contrast Solid White Terminal Core -->
      <circle cx="356" cy="332" r="11" fill="#ffffff" />
    </g>

    <!-- Node 3: Bottom-Left Node (Vibrant Cobalt/Indigo Transition) -->
    <g id="left-node">
      <!-- Outer Solid Node Body -->
      <circle cx="156" cy="332" r="38" fill="#2563eb" />
      <!-- Dark Mechanical Separator Ring -->
      <circle cx="156" cy="332" r="22" fill="#0e131d" />
      <!-- High-Contrast Solid White Terminal Core -->
      <circle cx="156" cy="332" r="11" fill="#ffffff" />
    </g>
  </g>
</svg>