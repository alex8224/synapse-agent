[package]
name = "synapse-core-tool"
version = "0.1.4"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
description = "Native filesystem tools for Synapse."
publish = false

[lib]
name = "synapse_core_tool"
crate-type = ["cdylib", "rlib"]

[dependencies]
async-openai = { version = "0.41", features = ["chat-completion", "byot"] }
chardetng = "0.1"
encoding_rs = "0.8"
futures-util = "0.3"
grep-regex = "0.1"
grep-searcher = "0.1"
globset = "0.4"
ignore = "0.4"
pyo3 = { version = "0.23", features = ["abi3-py312", "extension-module"] }
ratex-layout = "=0.1.14"
ratex-parser = "=0.1.14"
ratex-render = { version = "=0.1.14", features = ["embed-fonts"] }
ratex-types = "=0.1.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }