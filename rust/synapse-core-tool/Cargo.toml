[package]
name = "synapse-core-tool"
version = "0.1.3"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
description = "Native filesystem tools for Synapse."
publish = false

[lib]
name = "synapse_core_tool"
crate-type = ["cdylib", "rlib"]

[dependencies]
chardetng = "0.1"
encoding_rs = "0.8"
grep-regex = "0.1"
grep-searcher = "0.1"
globset = "0.4"
ignore = "0.4"
pyo3 = { version = "0.23", features = ["abi3-py312", "extension-module"] }
ratex-layout = "=0.1.14"
ratex-parser = "=0.1.14"
ratex-render = { version = "=0.1.14", features = ["embed-fonts"] }
ratex-types = "=0.1.14"
thiserror = "2.0"