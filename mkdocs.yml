site_name: Synapse
site_description: Local coding agent built on LangChain Deep Agents - Usage & Configuration Guide
repo_url: https://github.com/alex8224/synapse
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 深色模式
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 浅色模式
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate

plugins:
  - search:
      lang: zh

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - 概述: index.md
  - 安装: install.md
  - 快速开始: quickstart.md
  - CLI 命令参考: cli.md
  - 配置指南: config.md
  - 子代理: subagents.md
  - Agent Runtime 解耦实施文档:
