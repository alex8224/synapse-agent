[project]
name = "synapse-cli-agent"
version = "0.1.28"
description = "Local coding agent built on LangChain Deep Agents (LocalShell, no sandbox)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "alex8224", email = "alex8224@gmail.com" }
]
requires-python = ">=3.12"

dependencies = [
    "synapse-core-tool>=0.1.0,<0.2.0",
    "aiosqlite==0.22.1",
    "deepagents==0.6.12",
    "httpx[socks]==0.28.1",
    "langchain==1.3.14",
    "langchain-anthropic==1.4.8",
    "langchain-openai==1.3.5",
    "langgraph==1.2.9",
    "langgraph-checkpoint-sqlite==3.1.0",
    "mcp==1.28.1",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "rich==15.0.0",
    "termaid==0.7.1",
    "texicode==1.0.3",
    "textual==8.2.8",
    "textual-diff-view==0.1.5",
    "textual-image==0.13.2",
    "textual-serve==1.1.3",
    "typer==0.27.0",
    "websockets==15.0.1",
    "zstandard==0.25.0",
]

[project.urls]
Homepage = "https://github.com/alex8224/synapse-agent"
Repository = "https://github.com/alex8224/synapse-agent"
Issues = "https://github.com/alex8224/synapse-agent/issues"
Changelog = "https://github.com/alex8224/synapse-agent/blob/main/CHANGELOG.md"

[project.scripts]
synapse = "synapse.cli:main"
synapse-web = "synapse.web:main"

[project.optional-dependencies]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synapse"]

[tool.uv.sources]
synapse-core-tool = { path = "rust/synapse-core-tool" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = ["fixtures", ".*", "build", "dist"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]