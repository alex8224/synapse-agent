<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Installable console (PWA).  `public/` is served at the root by both Vite
      and the formal host, so these stay absolute paths; the manifest itself
      carries the icons, the standalone display mode and the `new-session`
      shortcut (see `web/README.md`).
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!--
      First-paint window frame color: the installed window's title bar, and under
      the window controls overlay the strip that carries the window buttons.  It
      must match the manifest's `theme_color`; `src/stores/appearance.ts` rewrites
      this tag as the theme changes, because the manifest cannot.
    -->
    <meta name="theme-color" content="#F8F9FA" />
    <!--
      Pre-paint theme: the bundle applies the stored appearance before its first
      React render, which is already too late to stop the light palette from
      flashing on a reload.  This reads the same key `src/stores/appearance.ts`
      writes (only the theme ids are duplicated, and `tests/appearance.test.ts`
      pins them together) and sets the attribute the CSS keys off; `system` and
      an unavailable storage both fall through to the shipped palette, which the
      bundle then resolves.
    -->
    <script>
      try {
        var choice = localStorage.getItem('synapse.console.appearance');
        if (choice === 'dark') document.documentElement.dataset.theme = 'fluent-dark';
        else if (choice === 'light') document.documentElement.dataset.theme = 'fluent-light';
      } catch (e) {
        /* Blocked storage: the bundle falls back to following the system. */
      }
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Synapse" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Synapse Console</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Geist:wght@600&display=swap" rel="stylesheet"/>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
