name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  web-console:
    name: Build Web Console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build the web console
        working-directory: web
        run: npm run build

      - name: Upload Web Console distribution
        uses: actions/upload-artifact@v4
        with:
          name: web-console-dist
          path: web/dist/
          if-no-files-found: error

  build:
    needs: web-console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Web Console distribution
        uses: actions/download-artifact@v4
        with:
          name: web-console-dist
          path: web/dist

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Extract changelog section
        run: |
          VERSION="${GITHUB_REF#refs/tags/}" python -c "
          import os, re
          ver = os.environ['VERSION']
          with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
              content = f.read()
          pattern = rf'(?ms)^## {re.escape(ver)}\n.*?(?=\n## |\Z)'
          m = re.search(pattern, content)
          if m:
              out = m.group().strip()
              with open('release_body.md', 'w', encoding='utf-8') as f:
                  f.write(out)
              print(f'Extracted {len(out)} chars for {ver}')
          else:
              raise SystemExit(f'ERROR: ## {ver} section not found in CHANGELOG.md')
          "

      - name: Build distributions
        run: uv build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Upload changelog body
        uses: actions/upload-artifact@v4
        with:
          name: release-body
          path: release_body.md
          if-no-files-found: error

  build-executables:
    name: executable (${{ matrix.name }})
    needs: web-console
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            artifact: executable-windows
            binname: synapse-windows-x64.exe
          # macOS executables target Apple Silicon only; Intel macOS is unsupported
          # (matches the native-core-tool wheels matrix).
          - name: macos
            os: macos-latest
            artifact: executable-macos
            binname: synapse-macos-arm64
          - name: linux
            os: ubuntu-latest
            artifact: executable-linux
            binname: synapse-linux-x64
    steps:
      - uses: actions/checkout@v4

      - name: Download Web Console distribution
        uses: actions/download-artifact@v4
        with:
          name: web-console-dist
          path: web/dist

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (builds local synapse-core-tool and synapse-tool-compress-core)
        run: uv sync --frozen

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Package executable with PyInstaller
        shell: pwsh
        run: |
          $dataSep = if ($env:RUNNER_OS -eq 'Windows') { ';' } else { ':' }
          uv run pyinstaller --noconfirm --clean --onefile --name synapse `
            --paths src `
            --add-data "web/dist${dataSep}synapse/web_console/static" `
            --collect-all textual `
            --collect-all textual_serve `
            --collect-all textual_image `
            --collect-all termaid `
            --collect-all texicode `
            --collect-all synapse_tool_compress_core `
            --collect-submodules synapse.runtime `
            --collect-data synapse `
            src/synapse/entry.py

      - name: Rename executable for artifact
        shell: pwsh
        run: |
          $ext = if ($env:RUNNER_OS -eq 'Windows') { '.exe' } else { '' }
          # Rename-Item refuses a destination that contains a path separator
          # (pwsh treats it as a device path); Move-Item -LiteralPath is safe.
          Move-Item -LiteralPath "dist/synapse$ext" -Destination "dist/${{ matrix.binname }}"
          Write-Host "Renamed to ${{ matrix.binname }}"

      - name: Fix executable permission (Unix)
        if: runner.os != 'Windows'
        run: chmod +x "dist/${{ matrix.binname }}"

      # A green packaging job does not prove the executable runs: the bundled
      # interpreter only surfaces missing lazy submodules at import time.  Smoke
      # the two entry points the single-file build must serve -- the CLI and the
      # runtime daemon dispatch -- so a packaging gap fails here instead of in a
      # user's terminal.
      - name: Smoke test the executable
        shell: pwsh
        run: |
          $exe = "dist/${{ matrix.binname }}"
          if (-not (Test-Path -LiteralPath $exe)) { throw "executable missing: $exe" }

          # 1) The CLI must start and report its commands.
          $help = & $exe --help 2>&1 | Out-String
          if ($help -notmatch 'web-console') { throw "CLI --help lost the web-console command: $help" }

          # 2) The frozen daemon dispatch must boot the real daemon: it prints a
          #    single ready JSON line to stdout once its socket is bound.  A
          #    missing bundled submodule dies at import with a non-zero exit.
          $smokeRoot = Join-Path ([System.IO.Path]::GetTempPath()) "synapse-smoke-$([System.Guid]::NewGuid().ToString('N'))"
          New-Item -ItemType Directory -Force -Path $smokeRoot | Out-Null
          # The daemon must create its own private state directory on POSIX;
          # a caller-created 0755 directory is intentionally rejected.
          $stateDir = Join-Path $smokeRoot "state"
          $out = Join-Path $smokeRoot "daemon.out"
          $err = Join-Path $smokeRoot "daemon.err"
          $proc = Start-Process -FilePath $exe -ArgumentList @(
            "--synapse-runtime-daemon", "--state-dir", $stateDir, "--host", "127.0.0.1", "--port", "0"
          ) -NoNewWindow -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
          try {
            $deadline = (Get-Date).AddSeconds(60)
            $line = $null
            while ((Get-Date) -lt $deadline) {
              if ($proc.HasExited) { break }
              $line = Get-Content -LiteralPath $out -ErrorAction SilentlyContinue | Where-Object { $_.Trim() } | Select-Object -First 1
              if ($line) { break }
              Start-Sleep -Milliseconds 500
            }
            if (-not $line) {
              $stderr = Get-Content -LiteralPath $err -ErrorAction SilentlyContinue | Out-String
              throw "daemon dispatch produced no ready line (exit=$($proc.HasExited); $($proc.ExitCode)) stderr: $stderr"
            }
            $meta = $line | ConvertFrom-Json
            if (-not $meta.host -or -not $meta.port) { throw "daemon ready line is not endpoint metadata: $line" }
            Write-Host "daemon smoke OK: $line"
          } finally {
            if (-not $proc.HasExited) { $proc.Kill() }
          }

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "dist/${{ matrix.binname }}").Hash.ToLower()
          Set-Content -LiteralPath "dist/${{ matrix.binname }}.sha256" -Value $hash -NoNewline
          Write-Host "sha256 for ${{ matrix.binname }}: $hash"

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.binname }}
            dist/${{ matrix.binname }}.sha256
          if-no-files-found: error

  build-gui:
    name: gui (${{ matrix.name }})
    needs: [web-console, build-executables]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            artifact: gui-windows
            sidecar_artifact: executable-windows
            sidecar_bin: synapse-windows-x64.exe
            package_name: synapse-gui-windows-x64.zip
          - name: macos
            os: macos-latest
            artifact: gui-macos
            sidecar_artifact: executable-macos
            sidecar_bin: synapse-macos-arm64
            package_name: synapse-gui-macos-arm64.tar.gz
          - name: linux
            os: ubuntu-latest
            artifact: gui-linux
            sidecar_artifact: executable-linux
            sidecar_bin: synapse-linux-x64
            package_name: synapse-gui-linux-x64.tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Download sidecar executable
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.sidecar_artifact }}
          path: sidecar-dist

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare sidecar binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "rust/synapse-gui/binaries" | Out-Null
          $targetBin = if ($IsWindows) { "synapse.exe" } else { "synapse" }
          Copy-Item "sidecar-dist/${{ matrix.sidecar_bin }}" "rust/synapse-gui/binaries/$targetBin"
          if (-not $IsWindows) {
            chmod +x "rust/synapse-gui/binaries/$targetBin"
          }

      - name: Build Synapse GUI
        run: cargo build --release --manifest-path rust/synapse-gui/Cargo.toml

      - name: Assemble release package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bundle | Out-Null
          Copy-Item "rust/synapse-gui/target/release/synapse-gui.exe" "bundle/synapse-gui.exe"
          Copy-Item "sidecar-dist/${{ matrix.sidecar_bin }}" "bundle/synapse.exe"
          Compress-Archive -Path "bundle/*" -DestinationPath "${{ matrix.package_name }}"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "${{ matrix.package_name }}").Hash.ToLower()
          Set-Content -LiteralPath "${{ matrix.package_name }}.sha256" -Value $hash -NoNewline

          # Build standard NSIS installer bundle
          Push-Location rust/synapse-gui
          npx --yes @tauri-apps/cli build --bundles nsis
          Pop-Location
          $installer = Get-ChildItem "rust/synapse-gui/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if ($installer) {
            Copy-Item $installer.FullName "Synapse-Windows-x64-Setup.exe"
            $installerHash = (Get-FileHash -Algorithm SHA256 -LiteralPath "Synapse-Windows-x64-Setup.exe").Hash.ToLower()
            Set-Content -LiteralPath "Synapse-Windows-x64-Setup.exe.sha256" -Value $installerHash -NoNewline
          }

      - name: Assemble release package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p bundle
          cp "rust/synapse-gui/target/release/synapse-gui" "bundle/synapse-gui"
          cp "sidecar-dist/${{ matrix.sidecar_bin }}" "bundle/synapse"
          chmod +x bundle/*
          tar -czf "${{ matrix.package_name }}" -C bundle .
          shasum -a 256 "${{ matrix.package_name }}" | awk '{print $1}' > "${{ matrix.package_name }}.sha256"

      - name: Upload GUI package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.package_name }}
            ${{ matrix.package_name }}.sha256
            *-Setup.exe
            *-Setup.exe.sha256
          if-no-files-found: warn

  release:
    needs: [build, build-executables, build-gui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist

      - name: Download executable artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: executable-*
          merge-multiple: true
          path: executables

      - name: Download GUI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gui-*
          merge-multiple: true
          path: gui-packages

      - name: Download changelog body
        uses: actions/download-artifact@v4
        with:
          name: release-body
          path: .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            executables/*
            gui-packages/*
          body_path: release_body.md

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/synapse-cli-agent
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
